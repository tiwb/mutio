[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutio"
version = "0.9.999"
description = "I/O infrastructure toolkit for the mutobj ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "tiwb"},
]
keywords = ["io", "http", "mcp", "server", "client", "asgi"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mutobj~=0.9.0",
    "httpx[socks]>=0.27",
    "h11>=0.14.0",
    "wsproto>=1.2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/tiwb/mutio"
Repository = "https://github.com/tiwb/mutio"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mutio*"]

[tool.setuptools.package-data]
mutio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.uv.sources]
mutobj = { path = "../mutobj", editable = true }

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests/test_codec_json.py"]
extraPaths = ["src"]
enableExperimentalFeatures = true

